<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veggie Creature — Digital World</title>
<style>
  :root { --sky1: #bfe7ff; --sky2: #e8fbe0; --grass: #a4de7c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", system-ui, sans-serif; cursor: none;
    background: linear-gradient(#8fd3ff, var(--sky1) 45%, var(--sky2) 75%, var(--grass) 76%);
  }
  /* soft drifting clouds */
  .cloud { position: absolute; background: rgba(255,255,255,0.9); border-radius: 999px; filter: blur(2px); animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .sun { position: absolute; top: 6vh; right: 8vw; width: 11vmin; height: 11vmin; border-radius: 50%; background: #ffd97a; box-shadow: 0 0 60px 24px rgba(255, 217, 122, 0.55); }
  .creature { position: absolute; width: var(--size); transition: left 14s ease-in-out, top 14s ease-in-out; will-change: left, top; }
  /* a brand-new arrival walks in from the left edge */
  .creature.walk-in { transition: left 4.5s linear, top 4.5s ease-in-out; }
  .creature.walk-in img { animation: waddle 0.5s ease-in-out infinite; }
  @keyframes waddle { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-1.6vmin) rotate(3deg); } }
  .creature img { width: 100%; display: block; filter: drop-shadow(0 10px 12px rgba(60, 90, 30, 0.25)); }
</style>
</head>
<body>
<div class="sun"></div>
<div id="stage"></div>

<script>
// The display wall (PC #2). Polls /api/creatures (Vercel Blob relay in
// production, the local animator archive in dev) and lets every creature
// wander the meadow; a brand-new arrival pops in with a sparkle burst.
const stage = document.getElementById("stage");
const onStage = new Map(); // id -> {el, img, entry}
const MAX_ON_STAGE = 12;
const POLL_MS = 4000;

// clouds
for (let i = 0; i < 5; i++) {
  const c = document.createElement("div");
  c.className = "cloud";
  const w = 12 + Math.random() * 14;
  c.style.cssText = `width:${w}vmin;height:${w * 0.4}vmin;top:${3 + Math.random() * 26}vh;animation-duration:${60 + Math.random() * 80}s;animation-delay:-${Math.random() * 60}s`;
  document.body.appendChild(c);
}

function wanderSpot() {
  return { left: 4 + Math.random() * 78 + "vw", top: 34 + Math.random() * 48 + "vh" };
}

function addCreature(entry, isNew) {
  const el = document.createElement("div");
  el.className = "creature" + (isNew ? " walk-in" : "");
  el.style.setProperty("--size", 16 + Math.random() * 10 + "vmin");
  const spot = wanderSpot();
  if (isNew) {
    // continue the scan station's exit: stomp in from the left edge
    el.style.left = "-26vw";
    el.style.top = 52 + Math.random() * 24 + "vh";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.left = spot.left;
      el.style.top = spot.top;
    }));
    setTimeout(() => el.classList.remove("walk-in"), 4700);
  } else {
    el.style.left = spot.left;
    el.style.top = spot.top;
  }
  // clips are pre-made static files shipped with the site — only the variant
  // id travels through the cloud
  const greet = `/variants/${entry.variant}.greet.gif`;
  const smile = `/variants/${entry.variant}.smile.gif`;
  const img = document.createElement("img");
  img.src = greet;
  el.appendChild(img);
  stage.appendChild(el);
  onStage.set(entry.id, { el, img, entry });
  // alternate between the two clips now and then, and wander forever
  setInterval(() => {
    img.src = Math.random() < 0.5 ? greet : smile;
  }, 20000 + Math.random() * 15000);
  setInterval(() => {
    const s = wanderSpot();
    el.style.left = s.left;
    el.style.top = s.top;
  }, 12000 + Math.random() * 8000);
}

async function poll(first) {
  try {
    const r = await fetch("/api/creatures", { cache: "no-store" });
    const j = await r.json();
    const latest = (j.creatures || []).slice(0, MAX_ON_STAGE);
    for (const entry of [...latest].reverse()) {
      if (!onStage.has(entry.id)) addCreature(entry, !first);
    }
    // retire the oldest when the meadow gets crowded
    while (onStage.size > MAX_ON_STAGE) {
      const oldestId = [...onStage.keys()][0];
      onStage.get(oldestId).el.remove();
      onStage.delete(oldestId);
    }
  } catch (e) {
    /* offline blip — try again next poll */
  }
}

poll(true);
setInterval(() => poll(false), POLL_MS);
</script>
</body>
</html>
