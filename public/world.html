<script type="module">
// =====================================================================
// The Digital Village in REAL 3D (Three.js). Creatures are ASSEMBLED from
// parts at runtime — body vegetable + hat + limb style — and every motion
// (walk, wave, jump, spin, dance) is PROCEDURAL, shared by all bodies. So a
// hundred variants cost a handful of part assets and zero per-variant work.
// This first cut uses primitive geometry for the parts; each body/hat can be
// swapped for a real mesh (image-to-3D GLB) without touching the system.
// =====================================================================
import * as THREE from "three";
import { GLTFLoader } from "/vendor/three/examples/jsm/loaders/GLTFLoader.js";
import { RoomEnvironment } from "/vendor/three/examples/jsm/environments/RoomEnvironment.js";

const DEMO = new URLSearchParams(location.search).has("demo");
const DEBUG = new URLSearchParams(location.search).has("debug");
// ?closeup=tomato,leaves,twig,carrot  -> one creature, framed close, slowly turning (asset review / reveal)
const CLOSEUP = new URLSearchParams(location.search).get("closeup");
const POLL_MS = 5000;
const MAX_ON_STAGE = 12;
const POP_DELAY = 5000; // a new creature POPS into the village this long after the scan station's signal
const STAY_S = Number(new URLSearchParams(location.search).get("stay")); // ?stay=<seconds>: rehearsal crowds leave after this
const TIMED = DEMO || STAY_S > 0;   // rehearsal: creatures leave on a timer. Live: they stay until newer ones replace them
const RESIDENTS = Math.min(MAX_ON_STAGE, Number(new URLSearchParams(location.search).get("residents")) || 10); // ?residents=<n>
const STAY_MS = (e) => (STAY_S > 0 ? STAY_S * 1000 : DEMO ? 16000 + (e.at % 8000) : 90000 + (e.at % 60000));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

// ---- stage -----------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: /[?&](rig|closeup|shot)/.test(location.search) }); // canvas readback for asset review
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.2, 12);
camera.lookAt(0, 1.1, -1.5);

// painted backdrops, glued to the CAMERA at a fixed distance and sized exactly
// like CSS `cover` (never stretched beyond what the screen needs). The scene
// rotates every ROTATE_MS with a crossfade; the slot comes from the wall clock
// so refreshes and both PCs agree. ?bg=harvest|field|night|moon|market forces one.
// ground: where feet may land (x range at the far z edge; xNear = the x range
// at the near edge when the painted floor tapers). cam: this painting's eye
// height — a diorama shot from table height needs a lower camera than the
// moon village, and the camera glides between scenes with the crossfade.
const BACKDROP_D = 32;
const DEFAULT_CAM = { pos: [0, 3.2, 12], look: [0, 1.1, -1.5] };
const texLoader = new THREE.TextureLoader();
const SCENES = {
  harvest: { label: "황금 들녘", src: "/world3d-harvest.png", aspect: 1672 / 941, px: [1672, 941], ground: { x: [-4.8, 4.8], xNear: [-2.6, 2.8], z: [-6, 4.5] }, lift: 0, cam: { pos: [0, 2.2, 12], look: [0, 2.5, -1.5] }, hemi: [0xfff0d0, 0x9a6a3a, 1.0], sun: [0xffe8b8, 1.5], rim: [0xffc070, 0.7],
    // the painting's own life: its clouds and loose leaves were lifted out of
    // the art (public/fx) and drift/fall as sprites; the paddies sway in the shader
    fx: {
      wind: { rect: [0.28, 0.32, 0.68, 0.50], amp: 0.0016 },
      clouds: [
        { tex: "/fx/harvest_cloud1.png", x: 435, y: 162, speed: 5.5 },
        { tex: "/fx/harvest_cloud2.png", x: 1210, y: 217, speed: 4.2 },
        { tex: "/fx/harvest_cloud3.png", x: 1587, y: 230, speed: 6.5 },
      ],
      floaters: [{ sprites: ["/fx/leaf1.png", "/fx/leaf2.png", "/fx/leaf3.png"], spawn: [[30, 40, 330, 190, 7], [1500, 300, 1660, 400, 2]], vy: [13, 22], fade: [540, 610], sway: 16, spin: 0.55, size: [0.8, 1.15] }],
    } },
  field: { label: "가을 들판", src: "/world3d-field.png",  aspect: 1672 / 941, px: [1672, 941], ground: { x: [-4.8, 4.5], xNear: [-2.2, 2.0], z: [-6, 4.5] }, lift: 0, cam: { pos: [0, 2.2, 12], look: [0, 2.5, -1.5] }, hemi: [0xfff4d6, 0x9a6a3a, 1.0], sun: [0xfff2cc, 1.6], rim: [0xffd08a, 0.7],
    fx: { // its three clouds drift; its four loose leaves fall from the two trees
      clouds: [{ tex: "/fx/field_cloud1.png", x: 422, y: 251, speed: 4.5 }, { tex: "/fx/field_cloud2.png", x: 1104, y: 150, speed: 3.6 }, { tex: "/fx/field_cloud3.png", x: 1324, y: 296, speed: 5.2 }],
      floaters: [{ sprites: ["/fx/field_leaf1.png", "/fx/field_leaf2.png", "/fx/field_leaf3.png", "/fx/field_leaf4.png"], spawn: [[10, 170, 230, 400, 5], [1500, 220, 1672, 470, 3]], vy: [12, 20], fade: [480, 560], sway: 16, spin: 0.55, size: [0.8, 1.15] }],
    } },
  night: { label: "달빛 마을", src: "/world3d-night.png",  aspect: 1672 / 941, px: [1672, 941], ground: { x: [-3, 7], z: [-5, 3.5] }, lift: 0.02, hemi: [0xdfe6ff, 0x5a4a30, 0.85], sun: [0xfff0c8, 1.1],  rim: [0x9fb4ff, 0.8],
    gravity: 0.38, // it's the moon: jumps go higher and hang longer, the walk becomes a slow lope
    fx: { // the night cloud drifts; the painted stars blink; shooting stars every few seconds
      clouds: [{ tex: "/fx/night_cloud1.png", x: 108, y: 169, speed: 2.8 }],
      stars: "/fx/night_stars.json",
      twinkle: { min: 0.18, swell: 0.45, glint: 3.4 }, // a real blink: nearly out → bright, with a four-point glint at the peak
      meteors: { area: [250, 20, 1250, 160], every: [4, 9], len: [180, 260], thick: 9, dist: [220, 360], dur: [0.7, 1.0] },
    } },
  moon:  { label: "보름달 마당", src: "/world3d-moon.png",  aspect: 1672 / 941, px: [1672, 941], ground: { x: [-4.8, 6.5], xNear: [-1.2, 3.0], z: [-6, 4.5] }, lift: 0, cam: { pos: [0, 2.2, 12], look: [0, 2.5, -1.5] }, hemi: [0xffd9a8, 0x5a3a20, 0.9], sun: [0xffc890, 1.25], rim: [0x9fb4ff, 0.9],
    fx: { // sky lanterns rise from behind the ridge, the lake shimmers, wall lanterns flicker, maple leaves fall
      wind: { rect: [0.52, 0.462, 0.87, 0.50], amp: 0.0012 },
      floaters: [
        { sprites: ["/fx/moon_lantern1.png", "/fx/moon_lantern2.png", "/fx/moon_lantern3.png", "/fx/moon_lantern4.png", "/fx/moon_lantern5.png"], spawn: [[560, 430, 1500, 470, 5]], start: [[682, 144], [790, 90], [870, 206], [964, 298], [1456, 260]], vy: [-8, -4.5], fade: [140, 40], sway: 5, spin: 0, size: [1, 1], wait: [4, 16] },
        { sprites: ["/fx/field_leaf1.png", "/fx/leaf3.png", "/fx/leaf1.png"], spawn: [[220, 200, 500, 400, 4], [1260, 40, 1640, 180, 2]], vy: [10, 18], fade: [560, 620], sway: 14, spin: 0.55, size: [0.45, 0.65] },
      ],
      stars: "/fx/moon_stars.json",
      glows: [{ x: 455, y: 598, r: 34 }, { x: 665, y: 597, r: 34 }, { x: 1005, y: 603, r: 34 }, { x: 1400, y: 607, r: 34 }, { x: 118, y: 142, r: 40 }, { x: 206, y: 208, r: 36 }],
    } },
  market: { label: "가을 장터", src: "/world3d-market.png", aspect: 1672 / 941, px: [1672, 941], ground: { x: [-1.7, 1.9], xNear: [-4.0, 3.8], z: [-6, 4.5] }, lift: 0, cam: { pos: [0, 2.2, 12], look: [0, 2.5, -1.5] }, hemi: [0xffe2b8, 0x8a5a30, 0.95], sun: [0xffcc88, 1.4], rim: [0xffa860, 0.85],
    fx: { // its two clouds drift across the sunset; maple leaves fall from its trees (the near one big, the far ones small); the stall lanterns flicker and the sun breathes
      clouds: [{ tex: "/fx/market_cloud1.png", x: 584, y: 158, speed: 4.6 }, { tex: "/fx/market_cloud2.png", x: 1314, y: 71, speed: 3.4 }],
      floaters: [
        { sprites: ["/fx/market_leaf1.png", "/fx/market_leaf2.png", "/fx/market_leaf3.png"], spawn: [[0, 20, 430, 130, 6]], vy: [14, 24], fade: [650, 750], sway: 18, spin: 0.55, size: [0.55, 0.85] },
        { sprites: ["/fx/market_leaf1.png", "/fx/market_leaf3.png", "/fx/market_leaf2.png"], spawn: [[1235, 190, 1400, 300, 2], [1400, 130, 1520, 200, 2]], vy: [9, 15], fade: [480, 550], sway: 10, spin: 0.55, size: [0.26, 0.38] },
      ],
      glows: [
        { x: 28, y: 337, r: 50, color: 0xffc860 }, { x: 1621, y: 368, r: 48, color: 0xffc860 }, { x: 1564, y: 394, r: 42, color: 0xff7a48 }, { x: 1313, y: 426, r: 30 }, { x: 1262, y: 434, r: 24, color: 0xffc860 },
        { x: 1117, y: 278, r: 200, color: 0xffe2a0, calm: true, base: 0.08, amp: 0.14 },
      ],
    } },
};
const SCENE_ORDER = ["harvest", "field", "night", "moon", "market"];
const _q = new URLSearchParams(location.search);
if (_q.has("clean")) document.body.classList.add("clean");
const FORCED_SCENE = SCENE_ORDER.includes(_q.get("bg")) ? _q.get("bg") : null;
const ROTATE_MS = Math.max(0.5, Number(_q.get("rotate")) || 10) * 60000;
let pickedScene = null; // set by the ◀ ▶ rehearsal control; cleared when going fullscreen
const sceneNow = () => pickedScene || FORCED_SCENE || SCENE_ORDER[Math.floor(Date.now() / ROTATE_MS) % SCENE_ORDER.length];
const loadBg = (src) => { const t = texLoader.load(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.minFilter = THREE.LinearMipmapLinearFilter; return t; };
// the backdrop shader: the painting as-is, except a masked band (the crops)
// that sways gently and catches travelling gusts of light — wind over a field
const BG_VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const BG_FRAG = `
uniform sampler2D map; uniform float opacity; uniform float time;
uniform vec4 windRect; uniform float windAmp;
varying vec2 vUv;
void main() {
  vec2 uv = vUv;
  float m = smoothstep(windRect.x, windRect.x + 0.06, uv.x) * (1.0 - smoothstep(windRect.z - 0.06, windRect.z, uv.x))
          * smoothstep(windRect.y, windRect.y + 0.04, uv.y) * (1.0 - smoothstep(windRect.w - 0.04, windRect.w, uv.y));
  float w = sin(uv.x * 28.0 - time * 1.1 + uv.y * 9.0) * 0.6 + sin(uv.x * 61.0 - time * 1.9 + uv.y * 4.0) * 0.4;
  uv += vec2(w, w * 0.35) * windAmp * m;
  vec4 c = texture2D(map, uv);
  float g = sin(uv.x * 9.0 - time * 0.7 + uv.y * 4.0);
  c.rgb *= 1.0 + 0.035 * g * m;
  gl_FragColor = vec4(c.rgb, c.a * opacity);
  #include <colorspace_fragment>
}`;
const bgMaterial = (opacity) => new THREE.ShaderMaterial({
  vertexShader: BG_VERT, fragmentShader: BG_FRAG, transparent: true, depthWrite: false,
  uniforms: { map: { value: null }, opacity: { value: opacity }, time: { value: 0 }, windRect: { value: new THREE.Vector4() }, windAmp: { value: 0 } },
});
const bgA = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMaterial(1));
const bgB = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMaterial(0));
bgA.position.set(0, 0, -BACKDROP_D); bgB.position.set(0, 0, -BACKDROP_D + 0.01);
camera.add(bgA, bgB);
function setBgScene(mesh, name) {
  const sc = SCENES[name], u = mesh.material.uniforms;
  u.map.value = loadBg(sc.src);
  const wind = sc.fx?.wind;
  u.windRect.value.set(...(wind ? wind.rect : [0, 0, 0, 0]));
  u.windAmp.value = wind ? wind.amp : 0;
  mesh.userData.scene = name;
}
// how a scene's painting is fitted right now (cover + lift), for placing things on it
function fitFor(name) {
  const sc = SCENES[name] || SCENES[SCENE_ORDER[0]];
  const vh = 2 * BACKDROP_D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const vw = vh * camera.aspect;
  const lift = vh * (sc.lift ?? 0.06);
  const w = Math.max(vw, (vh + lift * 2) * sc.aspect);
  return { w, h: w / sc.aspect, lift };
}
scene.add(camera);
let currentScene = null, fading = null;
function fitBackdrop() {
  for (const m of [bgA, bgB]) {
    const f = fitFor(m.userData.scene); // cover, including the lifted strip (the painting's floor meets the 3D ground)
    m.scale.set(f.w, f.h, 1);
    m.position.y = f.lift;
  }
}
function applyScene(name, instant) {
  if (name === currentScene) return;
  const sc = SCENES[name];
  if (instant || !currentScene) {
    setBgScene(bgA, name);
    buildAmbient(name);
  } else {
    setBgScene(bgB, name);
    fading = { t: 0 };
    ambient.next = name; // this scene's life fades out, the new one's fades in
  }
  currentScene = name;
  document.getElementById("bgName").textContent = `${sc.label} ${SCENE_ORDER.indexOf(name) + 1}/${SCENE_ORDER.length}`;
  GROUND = sc.ground || GROUND;
  camGoal = sc.cam || DEFAULT_CAM;
  if (instant) { camera.position.set(...camGoal.pos); camLook.set(...camGoal.look); camera.lookAt(camLook); }
  else for (const c of onStage.values()) { // anyone now standing on a painted prop strolls back onto the floor
    const p = c.root.position, [x0, x1] = groundX(p.z);
    if (!c.leaving && (p.x < x0 || p.x > x1 || p.z < GROUND.z[0] || p.z > GROUND.z[1])) { c.target = freeSpot(c); c.mode = "walk"; }
  }
  fitBackdrop();
}
let camGoal = DEFAULT_CAM;
const camLook = new THREE.Vector3(...DEFAULT_CAM.look);
const groundX = (z) => { // painted floors narrow toward the viewer: x range at this depth
  if (!GROUND.xNear) return GROUND.x;
  const t = THREE.MathUtils.clamp((z - GROUND.z[0]) / (GROUND.z[1] - GROUND.z[0]), 0, 1);
  return [THREE.MathUtils.lerp(GROUND.x[0], GROUND.xNear[0], t), THREE.MathUtils.lerp(GROUND.x[1], GROUND.xNear[1], t)];
};
// ---- the painting's ambient life ----------------------------------------
// Clouds and leaves are picture planes glued to the camera just in front of
// the backdrop, placed in the painting's own pixel coordinates so they stay
// put on the art whatever the screen size. They belong to one scene at a time
// and fade out/in with the scene crossfade.
const ambientGroup = new THREE.Group();
ambientGroup.position.z = -BACKDROP_D + 0.15;
camera.add(ambientGroup);
const ambient = { scene: null, next: null, opacity: 1, build: 0, clouds: [], floaters: [], stars: [], glows: [], time: 0 };

// ---- the QR carriers: in each scene, something that belongs there crosses the sky carrying the
// QR code — a shield kite over the harvest field, a small hot-air balloon over the autumn field, a
// flying saucer (moon rabbit at the controls) over the moon village, a sky lantern rising in the
// full-moon yard, a bunch of balloons floating up from the market. Every few minutes: in along its
// path, a slow middle stretch (long enough to point a phone at it), out. The prop's blank panel gets
// the QR (public/fx/qr_matrix.json, drawn on whole pixels at the screen's own scale so it scans)
// and a small label at runtime, MULTIPLIED into the paper so it reads as printed. ?banner=0 hides
// them; ?banner=<seconds> sets how often (default 150); &stay= keeps a demo crowd around to react.
const BANNER_Q = _q.get("banner");
const BANNER = {
  on: BANNER_Q !== "0",
  every: (Number(BANNER_Q) || 150) * 1000,
  first: Math.min(35000, (Number(BANNER_Q) || 150) * 1000), // ms after the page opens
  glide: 8000, hover: 14000,    // ms in, ms slow middle, ms out
  label: ["몽글키즈", "소식 받기"],
  // per scene: the prop, its width (painting px), its path (from → to, painting px; the slow middle is the
  // 40-60 % stretch), how it moves, what the creatures say about it
  by: {

// ---- character library ------------------------------------------------------
// Each creature is ONE complete kawaii figurine render (body + arms + legs
// rendered together, so limbs attach naturally — no collage) plus a hat
// overlay. The renders carry their own soft studio light, so they are drawn
// unlit; motion is whole-figure squash / hop / sway, Paper-Mario style, and
// the figure always faces the camera. A body x arms x legs render is one PNG
// listed in /parts/figures.json; hats are PNGs too — that is the whole cost
// of a new variant.
// the character rig (body heights, hat sockets, part names) is shared with the
// scan station: public/parts/rig.json is the one source of truth
let BODIES = {};
const PARTS = { hats: { none: null }, arms: {}, legs: {} };
const rigReady = fetch("/parts/rig.json").then((r) => r.json()).then((rig) => {
  BODIES = rig.bodies;
  Object.assign(PARTS.hats, rig.hats);
  for (const k of rig.arms) PARTS.arms[k] = 1;
  for (const k of rig.legs) PARTS.legs[k] = 1;
}).catch(() => {});
let FIGURES = {}; // "carrot_twig_carrot" -> { aspect }
const figuresReady = Promise.all([rigReady, fetch("/parts/figures.json").then((r) => r.json()).then((j) => { FIGURES = j; })]).catch(() => {});
const RIG = new URLSearchParams(location.search).has("rig");
const stickerTex = {};
function getTex(url) {
  if (!stickerTex[url]) { const t = texLoader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; stickerTex[url] = t; }
  return stickerTex[url];
}
// an unlit picture plane whose origin is its anchor (ax from the left, ay from the top)
function sticker(def) {
  const g = new THREE.Group();
  if (!def) return g;
  const h = def.h, w = h * def.aspect;
  const ax = def.ax ?? 0.5, ay = def.ay ?? 0.5;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: getTex(def.tex), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
  m.position.set(w / 2 - ax * w, ay * h - h / 2, 0);
  m.castShadow = true;
  g.add(m);
  if (RIG) g.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88 })));
  return g;
}

// ---- assembly ---------------------------------------------------------------
// parts = { body, hat, arms, legs }  ->  a Creature with animation state
function assemble(parts) {
  const root = new THREE.Group();          // feet on the ground (y=0)
  const b = BODIES[parts.body] || Object.values(BODIES)[0];
  const key = `${parts.body}_${parts.arms}_${parts.legs}`;
  const fig = FIGURES[key];
  // the complete figure (fallback: the body-only render until its figure exists)
  const def = fig
    ? { tex: `/parts/fig_${key}.png`, aspect: fig.aspect, h: b.h, ax: 0.5, ay: 1.0 }
    : { tex: `/parts/cute_body_${parts.body}.png`, aspect: fig ? 1 : 0.7, h: b.h * 0.8, ax: 0.5, ay: 1.0 };
  const bodyPivot = new THREE.Group();     // squash / hop / sway happens here (origin = feet)
  root.add(bodyPivot);
  const body = sticker(def);
  bodyPivot.add(body);
  const hat = sticker(PARTS.hats[parts.hat]);
  hat.position.set(0, def.h * (1 - (fig?.hatY ?? b.hatY)), 0.03); // each figure carries its own hat socket
  bodyPivot.add(hat);
  return { root, body, bodyPivot, hat, height: def.h, baseY: 0, dir: 1, t: rnd(0, 10), mode: "idle", modeT: 0 };
}

// whole-figure motion — the same for every character
function animate(c, dt) {
  c.t += dt; c.modeT += dt;
  const t = c.t, bp = c.bodyPivot;
  // scene gravity: lower g = higher arcs (h ~ 1/g^0.6, capped) and longer air time (T ~ 1/sqrt(g))
  const g = SCENES[currentScene]?.gravity ?? 1, gs = Math.sqrt(g), gh = Math.min(2, Math.pow(1 / g, 0.6));
  const rest = () => { bp.rotation.set(0, 0, 0); bp.scale.set(1, 1, 1); bp.position.y = 0; };
  switch (c.mode) {
    case "walk": {           // bouncy hop-walk, leaning into the direction
      const s = Math.sin(t * 9 * gs);
      bp.position.y = Math.abs(s) * 0.11 * gh;
      bp.rotation.z = -c.dir * 0.07 + s * 0.05;
      bp.scale.set(1 - Math.abs(s) * 0.03, 1 + Math.abs(s) * 0.04, 1);
      break;
    }
    case "wave": {           // happy wiggle (hello / bye)
      bp.rotation.z = Math.sin(t * 13) * 0.11;
      bp.position.y = Math.abs(Math.sin(t * 6.5)) * 0.06;
      bp.scale.set(1, 1, 1);
      break;
    }
    case "jump": {
      const T = 0.75 / gs;
      const p = Math.min(1, c.modeT / T);
      const arc = Math.sin(p * Math.PI);
      bp.position.y = arc * 1.1 * gh;
      const sq = p < 0.12 ? 1 - (0.12 - p) * 2 : 1 + arc * 0.08;
      bp.scale.set(1 / sq, sq, 1);
      bp.rotation.z = g < 1 ? Math.sin(p * Math.PI) * 0.06 : 0; // a lazy lean at the top of a moon hop
      if (c.modeT >= T) { c.modeT = 0; c.jumps = (c.jumps || 0) + 1; if (c.jumps >= 3) { c.jumps = 0; c.mode = "idle"; } }
      break;
    }
    case "dance": {          // side-to-side sway with a bounce
      const s = Math.sin(t * 7), s2 = Math.sin(t * 14);
      bp.rotation.z = s * 0.16;
      bp.position.y = Math.abs(s2) * 0.08;
      bp.scale.set(1 + s2 * 0.02, 1 - s2 * 0.02, 1);
      break;
    }
    case "pop": {            // 뿅: elastic overshoot from nothing
      rest();
      const p = Math.min(1, c.modeT / 0.8);
      const e = 1 - Math.pow(2, -10 * p) * Math.cos(p * 7.5);
      const sc = Math.max(0.001, e);
      c.root.scale.set(sc, sc, sc);
      if (p >= 1) { c.mode = "idle"; c.root.scale.set(1, 1, 1); }
      break;
    }
    default: {               // idle: breathe + tiny sway
      const br = Math.sin(t * 2.2);
      bp.position.y = 0;
      bp.scale.set(1 + br * 0.012, 1 - br * 0.012, 1);
      bp.rotation.z = Math.sin(t * 0.9) * 0.03;
    }
  }
  c.root.rotation.y = 0; // always faces the wall
}

// ---- magic effects ----------------------------------------------------------
const FX = []; // { obj, life, ttl, update }
function fxAdd(obj, ttl, update) { scene.add(obj); FX.push({ obj, life: 0, ttl, update }); }
function fxTick(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i];
    f.life += dt;
    const p = f.life / f.ttl;
    if (p >= 1) { scene.remove(f.obj); f.obj.traverse?.((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); FX.splice(i, 1); continue; }
    f.update(p, dt);
  }
}
const glowMat = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
// a small pulsing light hovers where the creature is about to appear
function preglow(spot) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), glowMat(0xfff0c0));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), glowMat(0xffc35a, 0.35));
  g.add(core, halo);
  g.position.set(spot.x, 1.1, spot.z);
  const motes = [];
  for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), glowMat(0xffe29a)); m.userData = { a: rnd(0, 6.28), r: rnd(0.3, 0.7), s: rnd(2, 4), y: rnd(-0.3, 0.3) }; g.add(m); motes.push(m); }
  fxAdd(g, 1.3, (p) => {
    const pulse = 1 + 0.35 * Math.sin(p * 30) + p * 1.2;
    core.scale.setScalar(pulse); halo.scale.setScalar(pulse * (0.8 + p));
    halo.material.opacity = 0.35 * (1 - p * 0.5);
    for (const m of motes) { const u = m.userData; const a = u.a + p * u.s; const r = u.r * (1 - p * 0.8); m.position.set(Math.cos(a) * r, u.y + Math.sin(a * 1.7) * 0.2, Math.sin(a) * r); }
  });
}
// 뿅! sparkles fly out and a ring of light spreads on the ground
function burst(spot, height) {
  const g = new THREE.Group();
  g.position.set(spot.x, 0, spot.z);
  const parts = [];
  for (let i = 0; i < 34; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(rnd(0.05, 0.11), 8, 6), glowMat(pick([0xfff2c8, 0xffd27a, 0xffb347, 0xffffff])));
    const a = rnd(0, 6.28), up = rnd(0.5, 1.4), sp = rnd(2.2, 4.5);
    m.userData = { v: new THREE.Vector3(Math.cos(a) * sp * rnd(0.4, 1), 3 + up * 3, Math.sin(a) * sp * rnd(0.4, 1)) };
    m.position.set(0, height * 0.5, 0);
    g.add(m); parts.push(m);
  }
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.38, 48), glowMat(0xffd27a, 0.9));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
  g.add(ring);
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), glowMat(0xfff6e0, 0.9));
  flash.position.y = height * 0.5;
  g.add(flash);
  fxAdd(g, 1.1, (p, dt) => {
    for (const m of parts) { m.userData.v.y -= 9 * dt; m.position.addScaledVector(m.userData.v, dt); m.material.opacity = 1 - p; m.scale.setScalar(1 - p * 0.6); }
    ring.scale.setScalar(1 + p * 9); ring.material.opacity = 0.9 * (1 - p);
    flash.scale.setScalar(1 + p * 6); flash.material.opacity = 0.9 * Math.max(0, 1 - p * 3);
  });
}

// until the matcher returns parts, derive hat/limbs from the record id
function partsFor(entry) {
  // the scan station sends the exact part set the matcher saw; anything it
  // doesn't know (older records, a bad field) falls back to the hash pick
  const p = entry.parts;
  if (p && BODIES[p.body] && p.hat in PARTS.hats && PARTS.arms[p.arms] && PARTS.legs[p.legs]) return p;
  const h = hash(entry.id);
  const keys = (o) => Object.keys(o);
  return {
    body: BODIES[entry.variant] ? entry.variant : keys(BODIES)[(h >>> 4) % keys(BODIES).length], // (a vegetable from before the line-up changed)
    hat: keys(PARTS.hats)[h % keys(PARTS.hats).length],
    arms: keys(PARTS.arms)[(h >>> 8) % keys(PARTS.arms).length],
    legs: keys(PARTS.legs)[(h >>> 16) % keys(PARTS.legs).length],
  };
}

// a newcomer's spot: the front half of the stage (nearest the camera = biggest on screen)
function frontSpot(self) {
  for (let i = 0; i < 12; i++) {
    const z = rnd(GROUND.z[0] + (GROUND.z[1] - GROUND.z[0]) * 0.55, GROUND.z[1] - 0.4);
    const s = { x: rnd(...groundX(z)) * 0.8, z };
    if (![...onStage.values()].some((o) => o !== self && Math.hypot(o.target.x - s.x, o.target.z - s.z) < 2.4)) return s;
  }
  return freeSpot(self);
}
const SPOTLIGHT_S = 45; // how long a newcomer wears its ring of light
function spotlight(c) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.78, 48), glowMat(0xffd27a, 0.55));
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.62, 40), glowMat(0xfff0c0, 0.22));
  ring.rotation.x = disc.rotation.x = -Math.PI / 2;
  ring.position.y = disc.position.y = 0.02;
  g.add(disc, ring);
  const w = c.height * 0.55;
  g.scale.set(w, 1, w * 0.8);
  fxAdd(g, SPOTLIGHT_S, (p) => {
    if (!onStage.has(c.entry.id) || c.leaving) { g.visible = false; return; }
    g.position.set(c.root.position.x, 0, c.root.position.z);
    const t = p * SPOTLIGHT_S, fade = Math.min(1, t / 0.6) * Math.min(1, (1 - p) * SPOTLIGHT_S / 4); // in, then a 4 s fade out
    const breathe = 0.8 + 0.2 * Math.sin(t * 2.4);
    ring.material.opacity = 0.55 * fade * breathe;
    disc.material.opacity = 0.22 * fade * breathe;
    ring.scale.setScalar(1 + 0.06 * Math.sin(t * 2.4));
  });
}
function freeSpot(self) {
  for (let i = 0; i < 12; i++) {
    const z = rnd(...GROUND.z);
    const s = { x: rnd(...groundX(z)), z };
    const crowded = [...onStage.values()].some((o) => o !== self && Math.hypot(o.target.x - s.x, o.target.z - s.z) < 2.4);
    if (!crowded) return s;
  }
  const z = rnd(...GROUND.z);
  return { x: rnd(...groundX(z)), z };
}

function addCreature(entry, isNew) {
  const parts = partsFor(entry);
  const c = assemble(parts);
  c.parts = parts;
  c.entry = entry;
  c.timers = [];
  c.leaving = false;
  const later = (fn, ms) => c.timers.push(setTimeout(fn, ms));
  const spot = isNew ? frontSpot(c) : freeSpot(c);
  c.target = spot;
  if (isNew) {
    c.root.position.set(spot.x, 0, spot.z);
    c.root.visible = false;
    c.mode = "idle";
    later(() => preglow(spot), POP_DELAY - 1300);
    later(() => { c.root.visible = true; c.mode = "pop"; c.modeT = 0; c.dir = 1; burst(spot, c.height); }, POP_DELAY);
    later(() => welcome(c), POP_DELAY + 1100);
    later(() => spotlight(c), POP_DELAY + 300);
    c.bornAt = performance.now() + POP_DELAY;
  } else { c.root.position.set(spot.x, 0, spot.z); c.mode = "idle"; }
  c.speed = 2.6;
  scene.add(c.root);
  onStage.set(entry.id, c);

  // life: pick a behaviour every few seconds
  function behave() {
    if (c.leaving) return;

    const fresh = (performance.now() - (c.bornAt || 0)) / 1000 < SPOTLIGHT_S; // (a newcomer stays near the front for a while)
    if (r < 0.3) { const z = THREE.MathUtils.clamp(c.root.position.z + rnd(fresh ? -0.6 : -1.5, fresh ? 0.6 : 1.5), ...GROUND.z); c.target = { x: THREE.MathUtils.clamp(c.root.position.x + rnd(-2.5, 2.5), ...groundX(z)), z }; c.mode = "walk"; }

    else if (r < 0.72) { c.mode = "jump"; c.modeT = 0; c.dir = 1; }
    else { c.mode = "dance"; c.dir = 1; }

// ---- data ------------------------------------------------------------------
// The village is never empty: the latest RESIDENTS creations LIVE here. A new arrival pops in with
// its fanfare and the oldest resident waves goodbye and walks off; nobody leaves on a timer. (At 20
// children an hour a creature stays ~30 min; at a rush of 40, ~15 — long enough to be found, and the
// wall is full all day. With a timer of ~2 min it was empty half the day.) A reload — or the next
// morning — brings the latest residents straight back from the store.
async function poll(first) {
  try {
    const r = await fetch("/api/creatures", { cache: "no-store" });
    const j = await r.json();
    const residents = (j.creatures || []).slice(0, RESIDENTS);
    const want = new Set(residents.map((e) => e.id));
    for (const e of [...residents].reverse()) { // oldest first, so the stage keeps arrival order
      if (onStage.has(e.id) || (TIMED && (departed.has(e.id) || gone(e)))) continue;
      addCreature(e, !first);
      onStage.get(e.id).fromStore = true;
    }
    for (const c of onStage.values()) if (c.fromStore && !want.has(c.entry.id)) leave(c);
    // (a rehearsal crowd on top of the residents: the oldest walk off)
    const staying = [...onStage.values()].filter((c) => !c.leaving);
    for (let i = 0; i < staying.length - MAX_ON_STAGE; i++) leave(staying[i]);
  } catch (e) { /* offline blip */ }
}

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  fxTick(dt);
  bgA.material.uniforms.time.value = bgB.material.uniforms.time.value = clock.elapsedTime;
  ambientTick(dt);
  if (fading) {
    fading.t = Math.min(1, fading.t + dt / 1.6);
    bgB.material.uniforms.opacity.value = fading.t;
    if (fading.t >= 1) { setBgScene(bgA, bgB.userData.scene); bgB.material.uniforms.opacity.value = 0; fading = null; fitBackdrop(); }
  }
  { const sc = SCENES[currentScene] || SCENES[SCENE_ORDER[0]]; const k = Math.min(1, dt * 1.5);
    hemi.color.lerp(new THREE.Color(sc.hemi[0]), k); hemi.groundColor.lerp(new THREE.Color(sc.hemi[1]), k); hemi.intensity += (sc.hemi[2] - hemi.intensity) * k;
    sun.color.lerp(new THREE.Color(sc.sun[0]), k); sun.intensity += (sc.sun[1] - sun.intensity) * k;
    rim.color.lerp(new THREE.Color(sc.rim[0]), k); rim.intensity += (sc.rim[1] - rim.intensity) * k; }

    const k = Math.min(1, dt * 1.4);

    if (c.mode === "walk") {

      const d = Math.hypot(dx, dz);
      if (d < 0.08) { c.mode = c.leaving ? "walk" : "idle"; c.dir = 1; if (c.leaving && c.root.position.x > 13) { removeCreature(c); continue; } }
      else {

        c.root.position.x += (dx / d) * step; c.root.position.z += (dz / d) * step;
        if (Math.abs(dx) > 0.05) c.dir = dx < 0 ? -1 : 1; // paper doll flips to face its heading

// BGM: the two tracks, in this order, round and round all day. One <audio>
// at a time, each track eased in and out so the hand-over is soft; the next
// one is preloaded so there is no gap. Browsers refuse to start sound before
// someone has touched the page — then the first click/key anywhere (the
// fullscreen button counts) starts it; a kiosk Chrome launched with
// --autoplay-policy=no-user-gesture-required starts by itself.
// M = mute, [ ] = volume (remembered on this PC). ?bgm=0 turns it off, ?vol=0.5 sets it.
const BGM = ["/bgm/01-autumn-small-world.mp3", "/bgm/02-autumn-weather.mp3"];
const bgm = { i: 0, el: new Audio(), next: new Audio(), vol: 0.6, muted: false, blocked: false, FADE: 2.0 };
const sndBtn = document.getElementById("snd");
if (_q.get("bgm") === "0") sndBtn.style.display = "none";
else {
  try {
    const v = Number(_q.get("vol") ?? localStorage.getItem("vc_bgm_vol"));
    if (Number.isFinite(v) && v > 0 && v <= 1) bgm.vol = v;
    bgm.muted = localStorage.getItem("vc_bgm_muted") === "1";
  } catch {}
  const remember = () => { try { localStorage.setItem("vc_bgm_vol", String(bgm.vol)); localStorage.setItem("vc_bgm_muted", bgm.muted ? "1" : "0"); } catch {} };
  const paint = () => {
    sndBtn.querySelector("i").textContent = bgm.muted || bgm.blocked ? "🔇" : "🔊";
    sndBtn.querySelector("span").textContent = bgm.blocked && !bgm.muted ? "화면을 한 번 눌러 주세요" : "";
    sndBtn.classList.toggle("blocked", bgm.blocked && !bgm.muted);
  };
  const start = () => bgm.el.play().then(() => { bgm.blocked = false; paint(); }).catch((e) => {
    if (e?.name === "NotAllowedError") { bgm.blocked = true; paint(); } // wait for the first gesture (below)
  });
  const load = (i) => {
    bgm.i = (i + BGM.length) % BGM.length;
    bgm.el.src = BGM[bgm.i];
    bgm.el.volume = 0;
    bgm.next.src = BGM[(bgm.i + 1) % BGM.length]; // warms the cache for the hand-over
    bgm.next.preload = "auto";
    start();
  };
  bgm.el.preload = "auto";
  bgm.el.addEventListener("ended", () => load(bgm.i + 1));
  // a track that won't load or stalls must not silence the wall: move on
  bgm.el.addEventListener("error", () => setTimeout(() => load(bgm.i + 1), 3000));
  // ease in over the first seconds of a track and out over its last
  setInterval(() => {
    const a = bgm.el, d = a.duration, t = a.currentTime;
    const k = Number.isFinite(d) && d > 0 ? Math.max(0, Math.min(1, t / bgm.FADE, (d - t) / bgm.FADE)) : Math.min(1, t / bgm.FADE);
    a.volume = bgm.muted ? 0 : bgm.vol * (0.15 + 0.85 * k);
  }, 100);
  const kick = () => { if (bgm.blocked || bgm.el.paused) start(); };
  for (const ev of ["pointerdown", "keydown", "touchstart"]) window.addEventListener(ev, kick, { passive: true });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
  sndBtn.addEventListener("click", () => { bgm.muted = !bgm.muted; remember(); paint(); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M" || e.key === "ㅡ") { bgm.muted = !bgm.muted; remember(); paint(); }
    if (e.key === "[" || e.key === "]") { bgm.vol = Math.max(0.05, Math.min(1, bgm.vol + (e.key === "]" ? 0.1 : -0.1))); bgm.muted = false; remember(); paint(); }
  });
  paint();
  load(0);
  if (DEBUG) window.__bgm = bgm;
}

  if (fs) { pickedScene = null; applyScene(sceneNow()); } // the show runs on the clock again
});
let cursorTimer;
function wakeCursor() { document.body.classList.remove("hide-cursor"); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add("hide-cursor"), 2500); }
document.addEventListener("mousemove", wakeCursor);
wakeCursor();
</script>
