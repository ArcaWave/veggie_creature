<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veggie Creature — Digital World</title>
<style>
  :root { --sky1: #bfe7ff; --sky2: #e8fbe0; --grass: #a4de7c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", system-ui, sans-serif; cursor: none;
    background: linear-gradient(#8fd3ff, var(--sky1) 45%, var(--sky2) 75%, var(--grass) 76%);
  }
  /* soft drifting clouds */
  .cloud { position: absolute; background: rgba(255,255,255,0.9); border-radius: 999px; filter: blur(2px); animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .sun { position: absolute; top: 6vh; right: 8vw; width: 11vmin; height: 11vmin; border-radius: 50%; background: #ffd97a; box-shadow: 0 0 60px 24px rgba(255, 217, 122, 0.55); }

  .creature { position: absolute; width: var(--size); will-change: left, top; }
  .creature .flip { transform: scaleX(var(--flip, 1)); }
  .creature img { width: 100%; display: block; filter: drop-shadow(0 10px 12px rgba(60, 90, 30, 0.25)); }

  /* movement styles per behaviour — the transition is swapped by JS */
  .creature.walking { transition: left var(--walk-t, 4.5s) linear, top var(--walk-t, 4.5s) ease-in-out; }
  .creature.walking img { animation: waddle 0.5s ease-in-out infinite; }
  .creature.strolling { transition: left 10s ease-in-out, top 10s ease-in-out; }
  .creature.hopping img { animation: hop 0.6s cubic-bezier(0.3, 0, 0.4, 1) infinite; }
  @keyframes waddle { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-1.6vmin) rotate(3deg); } }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-4vmin) scale(0.98, 1.04); } 60% { transform: translateY(0) scale(1.05, 0.95); } }

  /* fullscreen button — hidden once fullscreen (exit with ESC) */
  #fs { position: absolute; top: 14px; right: 14px; z-index: 10; width: 48px; height: 48px; border: none; border-radius: 50%; background: rgba(255, 255, 255, 0.8); box-shadow: 0 4px 12px rgba(60, 90, 30, 0.2); font-size: 22px; cursor: pointer; color: #2e5d12; }
</style>
</head>
<body>
<div class="sun"></div>
<div id="stage"></div>
<button id="fs" title="전체화면" aria-label="전체화면">⛶</button>

<script>
// The display wall (PC #2). The meadow is a WAYPOINT on the creatures' journey:
// each one walks in from the left (continuing the scan station's exit), plays
// around for a while with its own randomized behaviour, then waves goodbye and
// walks off the right edge to continue travelling. Poll: /api/creatures.
// Add ?demo to the URL to shorten stays for rehearsal.
const stage = document.getElementById("stage");
const onStage = new Map(); // id -> creature controller
const departed = new Set(); // ids that finished their visit (don't re-add)
const MAX_ON_STAGE = 12;
const POLL_MS = 4000;
const DEMO = new URLSearchParams(location.search).has("demo");
// how long a creature stays before continuing its journey
const STAY_MS = () => (DEMO ? 12000 + Math.random() * 6000 : 90000 + Math.random() * 60000);

// clouds
for (let i = 0; i < 5; i++) {
  const c = document.createElement("div");
  c.className = "cloud";
  const w = 12 + Math.random() * 14;
  c.style.cssText = `width:${w}vmin;height:${w * 0.4}vmin;top:${3 + Math.random() * 26}vh;animation-duration:${60 + Math.random() * 80}s;animation-delay:-${Math.random() * 60}s`;
  document.body.appendChild(c);
}

const rnd = (a, b) => a + Math.random() * (b - a);
const wanderSpot = () => ({ left: rnd(4, 82) + "vw", top: rnd(36, 80) + "vh" });

function addCreature(entry, isNew) {
  if (departed.has(entry.id)) return;
  const el = document.createElement("div");
  el.className = "creature";
  el.style.setProperty("--size", rnd(16, 27) + "vmin");
  // clips ship with the site; the ?d= query desyncs gif playback between
  // creatures (same-src <img> animations run in lockstep otherwise)
  const greet = `/variants/${entry.variant}.greet.gif?d=${encodeURIComponent(entry.id)}`;
  const smile = `/variants/${entry.variant}.smile.gif?d=${encodeURIComponent(entry.id)}`;
  const flip = document.createElement("div");
  flip.className = "flip";
  const img = document.createElement("img");
  img.src = Math.random() < 0.5 ? greet : smile; // varied starting pose
  flip.appendChild(img);
  el.appendChild(flip);
  stage.appendChild(el);

  const c = { el, img, entry, greet, smile, timers: [], leaving: false };
  onStage.set(entry.id, c);
  const later = (fn, ms) => c.timers.push(setTimeout(fn, ms));

  function face(dir) { el.style.setProperty("--flip", dir); } // 1 right, -1 left
  function setMode(mode) { el.className = "creature" + (mode ? " " + mode : ""); }

  // ---- arrival: walk in from the left edge ----
  const spot = wanderSpot();
  if (isNew) {
    el.style.left = "-26vw";
    el.style.top = spot.top;
    setMode("walking");
    el.style.setProperty("--walk-t", "4.5s");
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.left = spot.left; }));
    later(() => behave(), 4700);
  } else {
    el.style.left = spot.left;
    el.style.top = spot.top;
    later(() => behave(), rnd(0, 2000));
  }

  // ---- life on the meadow: roll a new behaviour every few seconds ----
  function behave() {
    if (c.leaving) return;
    const roll = Math.random();
    if (roll < 0.4) {
      // just play in place (sometimes swapping the clip)
      setMode("");
      if (Math.random() < 0.5) img.src = Math.random() < 0.5 ? c.greet : c.smile;
    } else if (roll < 0.75) {
      // stroll to a nearby spot
      const s = wanderSpot();
      face(parseFloat(s.left) > parseFloat(el.style.left) ? 1 : -1);
      setMode("strolling");
      el.style.left = s.left;
      el.style.top = s.top;
    } else {
      // happy hopping on the spot
      setMode("hopping");
      img.src = c.smile;
    }
    later(behave, rnd(6000, 13000));
  }

  // ---- departure: wave goodbye, then walk off the right edge ----
  later(() => {
    c.leaving = true;
    setMode("");
    face(1);
    img.src = c.greet; // the wave clip doubles as "bye-bye!"
    later(() => {
      setMode("walking");
      el.style.setProperty("--walk-t", "6s");
      img.src = c.smile;
      el.style.left = "115vw";
      later(() => {
        c.timers.forEach(clearTimeout);
        el.remove();
        onStage.delete(entry.id);
        departed.add(entry.id);
      }, 6300);
    }, 2600);
  }, STAY_MS());
}

async function poll(first) {
  try {
    const r = await fetch("/api/creatures", { cache: "no-store" });
    const j = await r.json();
    const latest = (j.creatures || []).slice(0, MAX_ON_STAGE);
    for (const entry of [...latest].reverse()) {
      if (!onStage.has(entry.id) && !departed.has(entry.id)) addCreature(entry, !first);
    }
    // safety cap: if the meadow somehow overflows, the oldest leaves first
    while (onStage.size > MAX_ON_STAGE) {
      const oldest = onStage.get([...onStage.keys()][0]);
      oldest.timers.forEach(clearTimeout);
      oldest.el.remove();
      onStage.delete(oldest.entry.id);
      departed.add(oldest.entry.id);
    }
  } catch (e) {
    /* offline blip — try again next poll */
  }
}

poll(true);
setInterval(() => poll(false), POLL_MS);

// fullscreen button: click to fill the screen, hides itself while fullscreen
const fsBtn = document.getElementById("fs");
fsBtn.addEventListener("click", () => document.documentElement.requestFullscreen?.().catch(() => {}));
document.addEventListener("fullscreenchange", () => {
  fsBtn.style.display = document.fullscreenElement ? "none" : "";
});
</script>
</body>
</html>
