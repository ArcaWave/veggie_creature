<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veggie Creature — Digital Village (3D)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #1a0d05; }
  canvas { display: block; }
  body.hide-cursor, body.hide-cursor * { cursor: none !important; }
  #fs { position: absolute; top: 14px; right: 14px; z-index: 10; width: 48px; height: 48px; border-radius: 50%; background: rgba(28, 13, 4, 0.45); color: #fff4dc; border: 1px solid rgba(233, 185, 104, 0.55); backdrop-filter: blur(12px); font-size: 22px; cursor: pointer; }
  #hud { position: absolute; left: 14px; bottom: 12px; z-index: 10; color: rgba(255, 244, 220, 0.55); font: 600 13px/1.4 "Noto Serif KR", serif; letter-spacing: 0.08em; pointer-events: none; }
</style>
</head>
<body>
<button id="fs" title="전체화면">⛶</button>
<div id="hud"></div>

<script type="module">
// =====================================================================
// The Digital Village in REAL 3D (Three.js). Creatures are ASSEMBLED from
// parts at runtime — body vegetable + hat + limb style — and every motion
// (walk, wave, jump, spin, dance) is PROCEDURAL, shared by all bodies. So a
// hundred variants cost a handful of part assets and zero per-variant work.
// This first cut uses primitive geometry for the parts; each body/hat can be
// swapped for a real mesh (image-to-3D GLB) without touching the system.
// =====================================================================
import * as THREE from "/vendor/three/three.module.js";

const DEMO = new URLSearchParams(location.search).has("demo");
const DEBUG = new URLSearchParams(location.search).has("debug");
// ?closeup=carrot,leaves,twig,carrot  -> one creature, framed close, slowly turning (asset review / reveal)
const CLOSEUP = new URLSearchParams(location.search).get("closeup");
const POLL_MS = 4000;
const MAX_ON_STAGE = 12;
const POP_DELAY = 5000; // a new creature POPS into the village this long after the scan station's signal
const STAY_MS = (e) => (DEMO ? 16000 + (e.at % 8000) : 90000 + (e.at % 60000));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

// ---- stage -----------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: /[?&](rig|closeup|shot)/.test(location.search) }); // canvas readback for asset review
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.2, 12);
camera.lookAt(0, 1.1, -1.5);

// painted courtyard as a far backdrop; the 3D ground sits on its stone floor
const BACKDROP_Z = -20;
const texLoader = new THREE.TextureLoader();
const bgTex = texLoader.load("/main-bg.png", (t) => { t.colorSpace = THREE.SRGBColorSpace; });
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: bgTex }));
backdrop.position.set(0, 0, BACKDROP_Z);
scene.add(backdrop);
function fitBackdrop() {
  const d = camera.position.z - BACKDROP_Z;
  const h = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.4;
  const w = Math.max(h * (16 / 9), h * camera.aspect);
  backdrop.scale.set(w, w * (9 / 16), 1);
  backdrop.position.y = camera.position.y - 0.9; // horizon of the painting ≈ upper-middle
}

// ground: invisible except for the shadows it catches (the painting shows through)
const GROUND = { x: [-7.5, 7.5], z: [-5.5, 4.5] };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
if (DEBUG) {
  const g = new THREE.GridHelper(20, 20, 0xffcc66, 0x885522);
  g.position.y = 0.01;
  scene.add(g);
}

// warm autumn light
scene.add(new THREE.HemisphereLight(0xffe9c8, 0x7a4a26, 1.35));
const sun = new THREE.DirectionalLight(0xffe0b0, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0005;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffb070, 0.9);
rim.position.set(-6, 4, -6);
scene.add(rim);

// ---- part library ----------------------------------------------------------
// The physical kit is a vegetable with printed STICKER parts stuck on. The 3D
// creature is the same idea taken literally: EVERY piece — body, hat, arms,
// legs — is a flat illustrated sticker standing in 3D space like a paper
// puppet, with real perspective and shadows. Adding a body or a part = one
// PNG + one catalog line, so a hundred variants stay cheap.
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0.02, ...extra });

// bodies: sticker + where things attach (fractions: y from the TOP of the
// sticker, x of the half-width)
const BODIES = {
  carrot:      { tex: "/parts/clay_body_carrot.png",      aspect: 313 / 700, h: 1.95, ax: 0.5, ay: 1.0, hatY: 0.16, armY: 0.50, armX: 0.96, legX: 0.4 },
  eggplant:    { tex: "/parts/clay_body_eggplant.png",    aspect: 410 / 700, h: 1.9,  ax: 0.5, ay: 1.0, hatY: 0.15, armY: 0.56, armX: 0.94, legX: 0.36 },
  tomato:      { tex: "/parts/clay_body_tomato.png",      aspect: 584 / 625, h: 1.45, ax: 0.5, ay: 1.0, hatY: 0.22, armY: 0.52, armX: 0.94, legX: 0.3 },
  potato:      { tex: "/parts/clay_body_potato.png",      aspect: 546 / 700, h: 1.6,  ax: 0.5, ay: 1.0, hatY: 0.09, armY: 0.5, armX: 0.94, legX: 0.34 },
  cucumber:    { tex: "/parts/clay_body_cucumber.png",    aspect: 358 / 700, h: 1.95, ax: 0.5, ay: 1.0, hatY: 0.05, armY: 0.50, armX: 0.96, legX: 0.4 },
  corn:        { tex: "/parts/clay_body_corn.png",        aspect: 370 / 700, h: 1.95, ax: 0.5, ay: 1.0, hatY: 0.18, armY: 0.55, armX: 0.94, legX: 0.4 },
  broccoli:    { tex: "/parts/clay_body_broccoli.png",    aspect: 584 / 700, h: 1.75, ax: 0.5, ay: 1.0, hatY: 0.06, armY: 0.5, armX: 0.9, legX: 0.22 },
  cauliflower: { tex: "/parts/clay_body_cauliflower.png", aspect: 700 / 600, h: 1.35, ax: 0.5, ay: 1.0, hatY: 0.1, armY: 0.56, armX: 0.9, legX: 0.3 },
};

// ---- sticker parts ----------------------------------------------------------
// catalog: texture, world height, and the ANCHOR — where this sticker is
// glued on (fractions of the image: x from the left, y from the top). Arms and
// legs hang from their anchor (shoulder / hip), hats stand on theirs. `rot`
// spins a sticker whose drawing points the other way. One PNG + one line per
// new part.
const PARTS = {
  hats: {
    none: null,
    leaves:  { tex: "/parts/clay_hat_leaves.png",  h: 0.62, aspect: 671 / 543, ax: 0.5, ay: 0.97 },
    acorn:   { tex: "/parts/clay_hat_acorn.png",   h: 0.74, aspect: 599 / 700, ax: 0.5, ay: 0.96 },
    straw:   { tex: "/parts/clay_hat_straw.png",   h: 0.44, aspect: 700 / 370, ax: 0.5, ay: 0.82 },
  },
  arms: {
    twig:     { tex: "/parts/clay_arm_twig.png",     h: 0.82, aspect: 370 / 700, ax: 0.48, ay: 0.03 },
    cucumber: { tex: "/parts/clay_arm_cucumber.png", h: 0.8,  aspect: 290 / 700, ax: 0.5,  ay: 0.03 },
    carrot:   { tex: "/parts/clay_arm_carrot.png",   h: 0.8,  aspect: 256 / 638, ax: 0.5,  ay: 0.04 },
  },
  legs: {
    twig:     { tex: "/parts/clay_leg_twig.png",     h: 0.62, aspect: 312 / 700, ax: 0.5, ay: 0.03 },
    cucumber: { tex: "/parts/clay_leg_cucumber.png", h: 0.6,  aspect: 296 / 700, ax: 0.5, ay: 0.03 },
    carrot:   { tex: "/parts/clay_leg_carrot.png",   h: 0.62, aspect: 296 / 700, ax: 0.5, ay: 0.03 },
  },
};
const RIG = new URLSearchParams(location.search).has("rig");
const stickerTex = {};
function getTex(url) {
  if (!stickerTex[url]) { const t = texLoader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; stickerTex[url] = t; }
  return stickerTex[url];
}
// a sticker: a thin double-sided plane whose origin is its ANCHOR point
function sticker(def, mirror = false) {
  const g = new THREE.Group();
  if (!def) return g;
  const h = def.h, w = h * def.aspect;
  const ax = def.ax ?? 0.5, ay = def.ay ?? 0.5;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: getTex(def.tex), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
  // move the anchor to the origin (mirror flips the x offset with the image)
  const ox = w / 2 - ax * w, oy = ay * h - h / 2;
  const inner = new THREE.Group();
  m.position.set(ox, oy, 0);
  m.castShadow = true;
  inner.add(m);
  if (def.rot) inner.rotation.z = def.rot;
  if (mirror) inner.scale.x = -1;
  g.add(inner);
  if (RIG) { const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88 })); g.add(dot); const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: 0x00ffcc })); box.position.copy(m.position); inner.add(box); }
  return g;
}

function makeEyes(armX) {
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), mat(0xffffff, { roughness: 0.25 }));
    w.position.set(s * armX, 0, 0);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mat(0x1b1410, { roughness: 0.2 }));
    p.position.set(0, -0.01, 0.09);
    w.add(p);
    g.add(w);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.022, 8, 16, Math.PI), mat(0x6e2418));
  mouth.rotation.z = Math.PI;
  mouth.position.set(0, -0.2, 0.02);
  g.add(mouth);
  return g;
}

// ---- assembly ---------------------------------------------------------------
// parts = { body, hat, arms, legs }  ->  a Creature with sockets + animation state
function assemble(parts) {
  const root = new THREE.Group();          // feet on the ground (y=0)
  const b = BODIES[parts.body];
  const legDef = PARTS.legs[parts.legs];
  const legLift = legDef.h * 0.8;          // the body rides on top of its sticker legs
  const baseY = legLift;
  const bw = b.h * b.aspect;
  const bodyPivot = new THREE.Group();     // squash/waddle/bob happens here (origin = body bottom)
  bodyPivot.position.y = baseY;
  root.add(bodyPivot);
  const body = sticker(b);
  bodyPivot.add(body);

  const hat = sticker(PARTS.hats[parts.hat]);
  hat.position.set(0, b.h * (1 - b.hatY), 0.05);
  bodyPivot.add(hat);

  const armDef = { ...PARTS.arms[parts.arms] };
  armDef.h = Math.min(armDef.h, b.h * 0.42);
  const armL = sticker(armDef), armR = sticker(armDef, true);
  const armY = b.h * (1 - b.armY), armX = (bw / 2) * b.armX;
  armL.position.set(-armX, armY, 0.04); armR.position.set(armX, armY, 0.04);
  armL.rotation.z = 0.32; armR.rotation.z = -0.32;
  bodyPivot.add(armL, armR);
  const legL = sticker(legDef, true), legR = sticker(legDef);
  const legY = legLift + legDef.h * 0.12, legX = (bw / 2) * b.legX;
  legL.position.set(-legX, legY, -0.02); legR.position.set(legX, legY, -0.02);
  root.add(legL, legR);

  return { root, bodyPivot, armL, armR, legL, legR, height: b.h, baseY, legY, dir: 1, t: rnd(0, 10), mode: "idle", modeT: 0 };
}

// procedural motion — the same for every body
function animate(c, dt) {
  c.t += dt; c.modeT += dt;
  const t = c.t, bp = c.bodyPivot;
  const rest = () => { bp.rotation.set(0, 0, 0); bp.scale.set(1, 1, 1); c.legL.rotation.x = c.legR.rotation.x = 0; };
  switch (c.mode) {
    case "walk": {
      const s = Math.sin(t * 9);
      bp.position.y = c.baseY + Math.abs(s) * 0.08;
      bp.rotation.z = s * 0.09;
      bp.rotation.x = 0.06;
      c.legL.rotation.x = s * 0.7; c.legR.rotation.x = -s * 0.7;
      c.armL.rotation.z = 0.32 + s * 0.3; c.armR.rotation.z = -0.32 + s * 0.3;
      break;
    }
    case "wave": {
      rest();
      bp.position.y = c.baseY + Math.sin(t * 4) * 0.03;
      c.armR.rotation.z = -2.7 + Math.sin(t * 12) * 0.35;
      c.armR.rotation.x = -0.3;
      c.armL.rotation.z = 0.32;
      break;
    }
    case "jump": {
      const p = Math.min(1, c.modeT / 0.75);
      const arc = Math.sin(p * Math.PI);
      bp.position.y = c.baseY + arc * 1.1;
      const sq = p < 0.12 ? 1 - (0.12 - p) * 2 : 1 + arc * 0.08;
      bp.scale.set(1 / sq, sq, 1 / sq);
      c.legL.rotation.x = c.legR.rotation.x = -arc * 0.8;
      c.legL.position.y = c.legR.position.y = c.legY + (bp.position.y - c.baseY);
      c.armL.rotation.z = 0.32 + arc * 1.8; c.armR.rotation.z = -0.32 - arc * 1.8;
      if (c.modeT >= 0.75) { c.modeT = 0; c.jumps = (c.jumps || 0) + 1; if (c.jumps >= 3) { c.jumps = 0; c.mode = "idle"; } }
      break;
    }
    case "pop": { // 뿅: elastic overshoot from nothing
      rest();
      const p = Math.min(1, c.modeT / 0.8);
      const e = 1 - Math.pow(2, -10 * p) * Math.cos(p * 7.5);
      const sc = Math.max(0.001, e);
      c.root.scale.set(c.dir * sc, sc, sc);
      bp.position.y = c.baseY + (1 - p) * 0.25;
      if (p >= 1) { c.mode = "idle"; c.root.scale.set(c.dir, 1, 1); }
      break;
    }
    case "spin": {
      rest();
      c.root.scale.x = Math.cos(t * 11) * c.dir || 0.02; // a flat doll spinning = flip-flop
      c.armL.rotation.z = 1.4; c.armR.rotation.z = -1.4;
      bp.position.y = c.baseY + Math.abs(Math.sin(t * 10)) * 0.05;
      break;
    }
    case "dance": {
      const s = Math.sin(t * 7), s2 = Math.sin(t * 7 + Math.PI / 2);
      bp.rotation.z = s * 0.14;
      bp.position.y = c.baseY + Math.abs(s2) * 0.1;
      c.armL.rotation.z = 0.32 + (s > 0 ? 2.3 : 0.2);
      c.armR.rotation.z = -0.32 - (s <= 0 ? 2.3 : 0.2);
      c.legL.rotation.x = s * 0.3; c.legR.rotation.x = -s * 0.3;
      break;
    }
    default: { // idle: breathe + tiny sway
      rest();
      bp.position.y = c.baseY + Math.sin(t * 2.2) * 0.03;
      bp.scale.set(1 + Math.sin(t * 2.2) * 0.012, 1 - Math.sin(t * 2.2) * 0.012, 1);
      bp.rotation.z = Math.sin(t * 0.9) * 0.03;
      c.armL.rotation.z = 0.32 + Math.sin(t * 1.6) * 0.1; c.armR.rotation.z = -0.32 - Math.sin(t * 1.6 + 1) * 0.1;
    }
  }
  if (c.mode !== "jump") { c.legL.position.y = c.legR.position.y = c.legY + (bp.position.y - c.baseY); }
  if (c.mode !== "spin" && c.mode !== "pop") c.root.scale.x += (c.dir - c.root.scale.x) * Math.min(1, dt * 10); // mirror to face the way we walk
  bp.rotation.y = 0;
}

// ---- magic effects ----------------------------------------------------------
const FX = []; // { obj, life, ttl, update }
function fxAdd(obj, ttl, update) { scene.add(obj); FX.push({ obj, life: 0, ttl, update }); }
function fxTick(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i];
    f.life += dt;
    const p = f.life / f.ttl;
    if (p >= 1) { scene.remove(f.obj); f.obj.traverse?.((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); FX.splice(i, 1); continue; }
    f.update(p, dt);
  }
}
const glowMat = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
// a small pulsing light hovers where the creature is about to appear
function preglow(spot) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), glowMat(0xfff0c0));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), glowMat(0xffc35a, 0.35));
  g.add(core, halo);
  g.position.set(spot.x, 1.1, spot.z);
  const motes = [];
  for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), glowMat(0xffe29a)); m.userData = { a: rnd(0, 6.28), r: rnd(0.3, 0.7), s: rnd(2, 4), y: rnd(-0.3, 0.3) }; g.add(m); motes.push(m); }
  fxAdd(g, 1.3, (p) => {
    const pulse = 1 + 0.35 * Math.sin(p * 30) + p * 1.2;
    core.scale.setScalar(pulse); halo.scale.setScalar(pulse * (0.8 + p));
    halo.material.opacity = 0.35 * (1 - p * 0.5);
    for (const m of motes) { const u = m.userData; const a = u.a + p * u.s; const r = u.r * (1 - p * 0.8); m.position.set(Math.cos(a) * r, u.y + Math.sin(a * 1.7) * 0.2, Math.sin(a) * r); }
  });
}
// 뿅! sparkles fly out and a ring of light spreads on the ground
function burst(spot, height) {
  const g = new THREE.Group();
  g.position.set(spot.x, 0, spot.z);
  const parts = [];
  for (let i = 0; i < 34; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(rnd(0.05, 0.11), 8, 6), glowMat(pick([0xfff2c8, 0xffd27a, 0xffb347, 0xffffff])));
    const a = rnd(0, 6.28), up = rnd(0.5, 1.4), sp = rnd(2.2, 4.5);
    m.userData = { v: new THREE.Vector3(Math.cos(a) * sp * rnd(0.4, 1), 3 + up * 3, Math.sin(a) * sp * rnd(0.4, 1)) };
    m.position.set(0, height * 0.5, 0);
    g.add(m); parts.push(m);
  }
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.38, 48), glowMat(0xffd27a, 0.9));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
  g.add(ring);
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), glowMat(0xfff6e0, 0.9));
  flash.position.y = height * 0.5;
  g.add(flash);
  fxAdd(g, 1.1, (p, dt) => {
    for (const m of parts) { m.userData.v.y -= 9 * dt; m.position.addScaledVector(m.userData.v, dt); m.material.opacity = 1 - p; m.scale.setScalar(1 - p * 0.6); }
    ring.scale.setScalar(1 + p * 9); ring.material.opacity = 0.9 * (1 - p);
    flash.scale.setScalar(1 + p * 6); flash.material.opacity = 0.9 * Math.max(0, 1 - p * 3);
  });
}

// ---- creatures on stage -----------------------------------------------------
const onStage = new Map();
const departed = new Set();
try { for (const id of JSON.parse(localStorage.getItem("vc3d-departed") || "[]")) departed.add(id); } catch (e) {}
function markDeparted(id) {
  departed.add(id);
  try { localStorage.setItem("vc3d-departed", JSON.stringify([...departed].slice(-300))); } catch (e) {}
}
const gone = (e) => Date.now() > e.at + STAY_MS(e);

// until the matcher returns parts, derive hat/limbs from the record id
function partsFor(entry) {
  if (entry.parts) return entry.parts;
  const h = hash(entry.id);
  const keys = (o) => Object.keys(o);
  return {
    body: BODIES[entry.variant] ? entry.variant : "carrot",
    hat: keys(PARTS.hats)[h % keys(PARTS.hats).length],
    arms: keys(PARTS.arms)[(h >>> 8) % keys(PARTS.arms).length],
    legs: keys(PARTS.legs)[(h >>> 16) % keys(PARTS.legs).length],
  };
}

function freeSpot(self) {
  for (let i = 0; i < 12; i++) {
    const s = { x: rnd(...GROUND.x), z: rnd(...GROUND.z) };
    const crowded = [...onStage.values()].some((o) => o !== self && Math.hypot(o.target.x - s.x, o.target.z - s.z) < 2.4);
    if (!crowded) return s;
  }
  return { x: rnd(...GROUND.x), z: rnd(...GROUND.z) };
}

function addCreature(entry, isNew) {
  const c = assemble(partsFor(entry));
  c.entry = entry;
  c.timers = [];
  c.leaving = false;
  const later = (fn, ms) => c.timers.push(setTimeout(fn, ms));
  const spot = freeSpot(c);
  c.target = spot;
  if (isNew) {
    c.root.position.set(spot.x, 0, spot.z);
    c.root.visible = false;
    c.mode = "idle";
    later(() => preglow(spot), POP_DELAY - 1300);
    later(() => { c.root.visible = true; c.mode = "pop"; c.modeT = 0; c.dir = 1; burst(spot, c.height); }, POP_DELAY);
  } else { c.root.position.set(spot.x, 0, spot.z); c.mode = "idle"; }
  c.speed = 2.6;
  scene.add(c.root);
  onStage.set(entry.id, c);

  // life: pick a behaviour every few seconds
  function behave() {
    if (c.leaving) return;
    const r = Math.random();
    if (r < 0.3) { c.target = { x: THREE.MathUtils.clamp(c.root.position.x + rnd(-2.5, 2.5), ...GROUND.x), z: THREE.MathUtils.clamp(c.root.position.z + rnd(-1.5, 1.5), ...GROUND.z) }; c.mode = "walk"; }
    else if (r < 0.5) { c.mode = "wave"; c.dir = 1; }
    else if (r < 0.65) { c.mode = "jump"; c.modeT = 0; c.dir = 1; }
    else if (r < 0.8) { c.mode = "spin"; }
    else { c.mode = "dance"; c.dir = 1; }
    later(behave, rnd(3500, 7000));
  }
  later(behave, isNew ? POP_DELAY + 2600 : rnd(500, 2500));

  // departure: wave bye, then walk off right
  later(() => {
    c.leaving = true;
    c.mode = "wave"; c.dir = 1;
    later(() => { c.target = { x: 14, z: c.root.position.z }; c.mode = "walk"; c.speed = 3.2; }, 2200);
  }, Math.max(entry.at + STAY_MS(entry) - Date.now(), DEMO ? 6000 : 15000));
}

function removeCreature(c) {
  c.timers.forEach(clearTimeout);
  scene.remove(c.root);
  onStage.delete(c.entry.id);
  markDeparted(c.entry.id);
}

// ---- data ------------------------------------------------------------------
async function poll(first) {
  try {
    const r = await fetch("/api/creatures", { cache: "no-store" });
    const j = await r.json();
    const latest = (j.creatures || []).slice(0, MAX_ON_STAGE);
    for (const e of [...latest].reverse()) {
      if (!onStage.has(e.id) && !departed.has(e.id) && !gone(e)) addCreature(e, !first);
    }
    while (onStage.size > MAX_ON_STAGE) removeCreature(onStage.get([...onStage.keys()][0]));
  } catch (e) { /* offline blip */ }
}
if (CLOSEUP) {
  const [body = "carrot", hat = "leaves", arms = "twig", legs = "carrot"] = CLOSEUP.split(",");
  const e = { id: `closeup-${body}`, variant: body, at: Date.now(), parts: { body, hat, arms, legs } };
  addCreature(e, false);
  const c = onStage.get(e.id);
  c.timers.forEach(clearTimeout); c.timers = [];
  c.root.position.set(0, 0, 3.5);
  c.mode = "idle";
  camera.position.set(0, 1.7, 8.0);
  camera.lookAt(0, 1.35, 3.5);
  fitBackdrop();
  window.__vc = c; // asset review: poke the creature from the console
  let turn = 0;
  if (!RIG) setInterval(() => { turn += 0.004; c.root.rotation.y = Math.sin(turn) * 0.35; }, 16);
  if (!RIG) setInterval(() => { c.mode = pick(["wave", "jump", "dance", "idle"]); c.modeT = 0; }, 4200);
} else if (DEMO && location.search.includes("seed")) {
  // local rehearsal without a server: a small crowd of mixed builds
  const bodies = Object.keys(BODIES);
  for (let i = 0; i < 6; i++) addCreature({ id: `${Date.now() - i * 777}-${bodies[i % bodies.length]}`, variant: bodies[i % bodies.length], at: Date.now() - i * 777 }, i < 2);
} else {
  poll(true);
  setInterval(() => poll(false), POLL_MS);
}

// ---- loop ------------------------------------------------------------------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  fxTick(dt);
  for (const c of onStage.values()) {
    if (c.mode === "walk") {
      const dx = c.target.x - c.root.position.x, dz = c.target.z - c.root.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.08) { c.mode = c.leaving ? "walk" : "idle"; c.dir = 1; if (c.leaving && c.root.position.x > 13) { removeCreature(c); continue; } }
      else {
        const step = Math.min(d, c.speed * dt);
        c.root.position.x += (dx / d) * step; c.root.position.z += (dz / d) * step;
        if (Math.abs(dx) > 0.05) c.dir = dx < 0 ? -1 : 1; // paper doll flips to face its heading
      }
    }
    animate(c, dt);
  }
  renderer.render(scene, camera);
  document.getElementById("hud").textContent = DEBUG ? `${onStage.size} on stage` : "";
}
fitBackdrop();
frame();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitBackdrop();
});

// fullscreen + auto-hiding cursor
const fsBtn = document.getElementById("fs");
fsBtn.addEventListener("click", () => document.documentElement.requestFullscreen?.().catch(() => {}));
document.addEventListener("fullscreenchange", () => { fsBtn.style.display = document.fullscreenElement ? "none" : ""; });
let cursorTimer;
function wakeCursor() { document.body.classList.remove("hide-cursor"); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add("hide-cursor"), 2500); }
document.addEventListener("mousemove", wakeCursor);
wakeCursor();
</script>
</body>
</html>
